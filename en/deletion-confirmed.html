<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Request Received — Instagram Widget by Luck</title>
  <meta name="description" content="Your data deletion request has been received." />
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <script>
    (function () {
      var d = document.documentElement; d.classList.add("js");
      try {
        var s = localStorage.getItem("theme");
        var dark = s ? s === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) { d.classList.add("dark"); var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute("content", "#191512"); }
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Hanken+Grotesk:wght@400..700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="/assets/theme.css" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/assets/tailwind.config.js"></script>
</head>

<body class="min-h-screen flex flex-col">

  <header class="site-header">
    <div class="wrap flex items-center justify-between h-16">
      <a href="/en" class="flex items-center shrink-0" aria-label="Instagram Widget by Luck — home">
        <img src="/logo-dark.svg" alt="Instagram Widget by Luck" class="logo-on-light h-7 w-auto" />
        <img src="/logo-white.svg" alt="Instagram Widget by Luck" class="logo-on-dark h-7 w-auto" />
      </a>
      <div class="flex items-center gap-3">
        <!-- Language Switcher -->
        <div class="flex items-center gap-1 text-[11px] font-semibold uppercase tracking-wider mono text-ink-soft mr-1" aria-label="Select language">
          <a href="/exclusao-confirmada" onclick="try{localStorage.setItem('lang', 'pt')}catch(e){}" class="hover:text-ocean transition-colors">PT</a>
          <span class="text-line opacity-40">|</span>
          <span class="text-ocean font-bold" aria-current="page">EN</span>
        </div>

        <button type="button" class="icon-btn" data-theme-toggle aria-label="Change theme">
          <svg class="moon w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" /></svg>
          <svg class="sun w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="wrap flex-1 flex items-center justify-center py-24">
    <div class="max-w-md text-center">
      <div class="w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-7" style="background-color: oklch(var(--brand) / .14);">
        <svg class="w-8 h-8 text-ocean" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg>
      </div>
      <h1 class="text-3xl font-extrabold tracking-tight">Request received</h1>
      <p class="text-ink-soft leading-relaxed mt-3 mb-8">
        We received your data deletion request. We will confirm by email within 2 business days and complete the deletion within 30 days.
      </p>
      <a href="/en" class="btn btn-ghost">← Back to home</a>
    </div>
  </main>

  <footer class="border-t border-line">
    <div class="wrap py-8 flex flex-col md:flex-row items-center justify-between gap-4 text-sm text-ink-mute">
      <!-- Language selector in footer -->
      <div class="flex items-center gap-2 text-xs font-semibold uppercase tracking-wider mono text-ink-soft" aria-label="Language / Idioma">
        <a href="/exclusao-confirmada" onclick="try{localStorage.setItem('lang', 'pt')}catch(e){}" class="hover:text-ocean transition-colors">PT-BR</a>
        <span class="text-line opacity-40">·</span>
        <span class="text-ocean" aria-current="page">EN-US</span>
      </div>
      <span>© 2026 Lucas Carvalho Serviços de Tecnologia · CNPJ 57.590.985/0001-70</span>
    </div>
  </footer>

  <script src="/assets/app.js"></script>
</body>

</html>
